cargo-features = ["panic-immediate-abort"]

[package]
name = "rustbg"
version = "1.0.0"
edition = "2024"

[dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "pipe", "process", "stdio"] }
wllib = { git = "https://github.com/spaceavenue/wllib.git", rev = "b6a0437b84b3508922265bfdc0fc162d133c11bb" }

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "immediate-abort"
